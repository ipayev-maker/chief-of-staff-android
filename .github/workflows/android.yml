name: Build Android APK

on:
  pull_request:
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/android.yml"]
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20

      - name: Build and lint Android
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nikodim-android-0.4.2
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
