  $(projectMode?'#wb':'#main').innerHTML=`<section class="page quick-notes-page"><header class="head"><div><span class="eyebrow">Личные записи</span><h1>Заметки</h1><p>Записи из Telegram и заметки без обязательной привязки к проекту.</p></div><div class="head-actions"><button class="btn" type="button" id="quickNotesRefresh" ${QN.loading||busy?'disabled':''}>${QN.loading?'Загружаю…':'Обновить'}</button>${!QN.authRequired?`<button class="btn primary" type="button" id="quickNoteNew" ${disabled}>＋ Новая заметка</button>`:''}</div></header>${QN.error?`<div class="error quick-note-error" role="alert">${esc(QN.error)}</div>`:''}${QN.authRequired?`<div class="quick-notes-login"><p>Войдите в аккаунт, чтобы открыть заметки.</p>${QN.pendingBackup?'<p>Несохранённый черновик восстановится после входа.</p>':''}${d&&quickNoteChanged()?`<section class="quick-note-auth-draft"><h2>Несохранённый черновик</h2>${d.title?`<p><b>${esc(d.title)}</b></p>`:''}<textarea readonly aria-label="Несохранённый текст заметки">${esc(d.plain_text)}</textarea><p>${QN.backupAvailable?'Черновик сохранён в этом браузере и восстановится после входа.':'Браузер не разрешил сохранить черновик. Скачайте его перед входом.'}</p><button class="btn" type="button" id="quickNoteDownload">Скачать черновик</button></section>`:''}<button class="btn primary" type="button" id="quickNotesLogin">Войти через Google</button></div>`:`<div class="quick-notes-tabs"><button class="btn ${!QN.archived?'active':''}" type="button" data-quick-archive="false" aria-pressed="${!QN.archived}" ${disabled}>Заметки</button><button class="btn ${QN.archived?'active':''}" type="button" data-quick-archive="true" aria-pressed="${QN.archived}" ${disabled}>Архив</button></div><div class="quick-notes-workspace"><aside class="quick-notes-list" aria-label="Список заметок">${QN.rows.map(row=>`<button class="side-item ${d?.id===row.id?'active':''}" type="button" data-quick-note="${esc(row.id)}" ${disabled}><b>${esc(quickNoteSidebarLabel(row))}</b><small>${esc(row.plain_text.slice(0,100))}</small><span class="note-source">${row.source==='telegram'?'Telegram':'Веб'} · ${esc(quickNoteDate(row.created_at))}${row.project_id?' · '+esc(projectName(row.project_id)):''}</span></button>`).join('')||`<div class="empty">${QN.loading?'Загружаю заметки…':QN.archived?'Архив пуст.':'Здесь появятся ваши заметки из Telegram. Можно также создать заметку вручную.'}</div>`}${QN.nextOffset!==null?`<button class="btn load-more" type="button" id="quickNotesMore" ${QN.loading||busy?'disabled':''}>Показать ещё</button>`:''}</aside><div class="quick-note-editor">${d?`<div class="quick-note-meta"><span>${d.source==='telegram'?'Из Telegram':'Веб-заметка'}</span>${d.created_at?`<time>${esc(quickNoteDate(d.created_at))}</time>`:''}${d.archived_at?'<span>В архиве</span>':''}</div><input class="title" id="quickNoteTitle" value="${esc(d.title)}" placeholder="Название (необязательно)" aria-label="Название заметки (необязательно)" maxlength="300" ${readonly}><textarea id="quickNoteBody" placeholder="Текст заметки…" aria-label="Текст заметки" maxlength="64000" ${readonly}>${esc(d.plain_text)}</textarea><label for="quickNoteProject">Проект (необязательно)</label><select id="quickNoteProject" ${readonly}><option value="">Без проекта</option>${S.projects.map(p=>`<option value="${esc(p.id)}" ${d.project_id===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select><div class="quick-note-actions">${d.id?`<button class="btn" type="button" id="quickNoteToTask" ${disabled}>Создать задачу</button>`:''}${!d.archived_at?`<button class="btn primary" type="button" id="quickNoteSave" ${disabled}>${busy?'Сохраняю…':'Сохранить'}</button>${d.id?`<button class="btn red" type="button" id="quickNoteArchive" ${disabled}>В архив</button>`:''}`:`<button class="btn" type="button" id="quickNoteRestore" ${disabled}>Восстановить</button>`}${!d.archived_at||dirty||QN.conflict||QN.createUncertain?`<button class="btn" type="button" id="quickNoteDiscard" ${disabled}>${d.id?'Отменить изменения':'Отменить'}</button>`:''}<span class="quick-note-save-state" id="quickNoteSaveState">${busy?'Сохраняю…':QN.conflict?'Конфликт версий':dirty?'Изменено':d.id?'Сохранено':'Новая заметка'}</span></div>`:'<div class="empty">Выберите заметку из списка или создайте новую.</div>'}</div></div>`}</section>`;
  $('#quickNotesRefresh').onclick=()=>loadQuickNotes().catch(()=>{});const login=$('#quickNotesLogin');if(login)login.onclick=()=>{backupQuickNoteDraft();openCalendarSettings()};const download=$('#quickNoteDownload');if(download)download.onclick=downloadQuickNoteDraft;const create=$('#quickNoteNew');if(create)create.onclick=newQuickNote;$$('[data-quick-archive]').forEach(el=>el.onclick=()=>{if(QN.archived!==(el.dataset.quickArchive==='true'))setQuickNotesArchive(el.dataset.quickArchive==='true')});$$('[data-quick-note]').forEach(el=>el.onclick=()=>selectQuickNote(el.dataset.quickNote));const more=$('#quickNotesMore');if(more)more.onclick=()=>loadQuickNotes(true).catch(()=>{});
  for(const id of ['quickNoteTitle','quickNoteBody','quickNoteProject']){const el=$('#'+id);if(el&&!el.disabled){el.oninput=syncQuickNoteInputs;el.onchange=syncQuickNoteInputs}}
  const toTask=$('#quickNoteToTask');if(toTask)toTask.onclick=()=>createTaskFromNote('quick');const save=$('#quickNoteSave');if(save)save.onclick=()=>saveQuickNote().catch(e=>{QN.error=e.message;quickNotesPage()});const archive=$('#quickNoteArchive');if(archive)archive.onclick=()=>archiveQuickNote(true);const restore=$('#quickNoteRestore');if(restore)restore.onclick=()=>archiveQuickNote(false);const discard=$('#quickNoteDiscard');if(discard)discard.onclick=()=>{const row=QN.rows.find(n=>n.id===QN.draft?.id);QN.draft=row?quickNoteDraft(row):null;QN.error='';QN.conflict=false;QN.createUncertain=false;clearQuickNoteBackup();quickNotesPage()};
  if(projectMode){const root=$('#wb');$('.head',root)?.remove();$('.quick-notes-tabs',root)?.remove();let list=$('.quick-notes-list',root);if(list){list.innerHTML=projectNotesListHTML();bindProjectNotesList()}else{const block=document.createElement('aside');block.className='quick-notes-list';block.innerHTML=projectNotesListHTML();root.prepend(block);bindProjectNotesList()}}appendNotesTaskDrawer();
  if(!QN.loaded&&!QN.loading&&!QN.error&&!QN.authRequired)loadQuickNotes().catch(()=>{});
}

// Calendar owner session is an HttpOnly cookie; never use the public data API key here.
const CALENDAR_ENDPOINT='/api/google-calendar';
const CALENDAR_CALLBACK_REASONS={denied:'Доступ к Google Calendar не предоставлен.',invalid_state:'Срок подключения истёк. Начните подключение заново.',wrong_account:'Выбран другой аккаунт Google. Используйте аккаунт владельца приложения.',missing_scope:'Не предоставлен доступ к календарю. Повторите подключение и разрешите доступ.',refresh_token_missing:'Google не предоставил доступ для последующей синхронизации. Подключитесь повторно.',calendar_setup_failed:'Создание календаря Chief of Staff не подтверждено. Обновите статус; перед повторным подключением необходимо проверить, был ли календарь создан.',connection_busy:'Подключение уже выполняется. Обновите статус через минуту.',oauth_failed:'Не удалось завершить подключение Google Calendar.'};
const CALENDAR_ISSUE_REASONS={meeting_end_required:'У встречи не указано окончание. Добавьте дату и время окончания.',meeting_end_must_follow_start:'Окончание встречи должно быть позже начала.',invalid_date:'Проверьте дату в задаче или встрече.',invalid_timestamp:'Проверьте дату, время и часовой пояс записи.',calendar_time_zone_required:'Для календаря не задан часовой пояс.',source_title_required:'У записи отсутствует название.',invalid_source_status:'Проверьте статус записи.',invalid_meeting_url:'У встречи некорректная ссылка.',deadline_date_differs_from_timestamp:'Дата срока отличается от даты точного времени. Используется точное время срока.',event_ownership_mismatch:'Событие в Google не удалось сопоставить с записью приложения.',google_event_cancelled:'Событие удалено в Google. Требуется проверка.',deadline_removed:'У задачи нет крайнего срока; событие не создаётся.',missing_deadline:'У задачи нет крайнего срока; событие не создаётся.',projection_failed:'Не удалось подготовить событие. Проверьте даты записи.'};
function calendarReason(reason){const key=String(reason);return Object.prototype.hasOwnProperty.call(CALENDAR_CALLBACK_REASONS,key)?CALENDAR_CALLBACK_REASONS[key]:'Не удалось завершить подключение. Попробуйте ещё раз.'}
function calendarTimeZone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch{return'UTC'}}
function calendarCount(value){const n=Number(value);return Number.isFinite(n)&&n>=0?Math.floor(n):0}
function calendarDate(value){if(!value)return'Ещё не выполнялась';const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString('ru-RU'):'Дата недоступна'}
async function calendarRequest(action,method='GET'){
  const r=await fetch(`${CALENDAR_ENDPOINT}/${action}`,{method,credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json',...(method==='POST'?{'Content-Type':'application/json'}:{})},...(method==='POST'?{body:'{}'}:{}),signal:AbortSignal.timeout(method==='POST'?90000:30000)});
  let body;try{body=await r.json()}catch{throw Error('Сервер не вернул состояние календаря. Попробуйте обновить статус позже.')}
  if(!r.ok){if(r.status===401)throw Error('Сессия подключения истекла. Обновите статус и подключите Google Calendar снова.');throw Error(`Не удалось выполнить запрос к календарю (HTTP ${r.status}). Обновите статус перед повтором.`)}
  return body;
}
function calendarStatusHTML(status){
  if(!status||typeof status.authenticated!=='boolean')throw Error('Сервер вернул неполное состояние календаря.');
  const conn=status.authenticated?status.connection:null,configured=status.configured!==false,disconnected=!conn||['disconnected','revoked','expired','needs_reconnect'].includes(conn.status),counts=status.counts||{},issues=Array.isArray(status.issues)?status.issues:[];
  const labels={connected:'Подключено',active:'Подключено',error:'Синхронизация требует внимания',syncing:'Выполняется синхронизация',pending:'Ожидает синхронизации',disconnected:'Отключено',revoked:'Доступ отозван',expired:'Требуется повторное подключение',needs_reconnect:'Требуется повторное подключение',provisioning:'Создание календаря требует проверки'};
  const label=conn?(labels[conn.status]||'Подключение сохранено'):'Не подключено';
  const info=conn?`<dl class="calendar-connection-info"><dt>Аккаунт</dt><dd>${esc(conn.email||'Не указан')}</dd><dt>Календарь</dt><dd>${esc(conn.calendarName||'Chief of Staff')}</dd><dt>Часовой пояс</dt><dd>${esc(conn.timeZone||'Не указан')}</dd><dt>Последняя синхронизация</dt><dd>${esc(calendarDate(conn.lastSyncAt))}</dd></dl>`:'';
  const metrics=conn?`<div class="calendar-sync-counts"><div><b>${calendarCount(counts.synced)}</b><span>Синхронизировано</span></div><div><b>${calendarCount(counts.pending)}</b><span>Ожидает синхронизации</span></div><div><b>${calendarCount(counts.errors)}</b><span>Требует исправления</span></div><div><b>${calendarCount(counts.undatedTasks)}</b><span>Задачи без срока</span></div></div><p class="calendar-help">Задачи без крайнего срока не переносятся в календарь. Дата запланированной работы и дата проверки не заменяют срок.</p>`:'';
  const issueList=issues.length?`<section class="calendar-issues"><h3>Нужно проверить</h3><ul>${issues.slice(0,50).map(issue=>`<li><b>${issue.kind==='meeting'?'Встреча':issue.kind==='task'?'Задача':'Запись'}: ${esc(issue.title||'Без названия')}</b><span>${esc(CALENDAR_ISSUE_REASONS[issue.reason]||'Не удалось синхронизировать запись. Проверьте её даты и повторите синхронизацию.')}</span></li>`).join('')}</ul>${issues.length>50?`<p class="calendar-help">Ещё записей, требующих проверки: ${issues.length-50}.</p>`:''}</section>`:'';
  const connect=disconnected&&configured?`<form action="${CALENDAR_ENDPOINT}/start" method="POST" data-calendar-connect><input type="hidden" name="time_zone" value="${esc(calendarTimeZone())}"><button class="btn primary" type="submit">Подключить Google Calendar</button></form>`:'';
  return `<p class="calendar-status-label">${esc(label)}</p>${!configured?'<p class="error" role="status">Подключение Google Calendar ещё не настроено на сервере.</p>':''}${info}${conn?.lastError?`<p class="error" role="status">${esc(CALENDAR_ISSUE_REASONS[conn.lastError]||'Последняя синхронизация завершилась с ошибкой. Проверьте записи ниже и повторите синхронизацию.')}</p>`:''}${metrics}${issueList}<div class="calendar-actions">${connect}${conn&&!disconnected?'<button class="btn primary" type="button" data-calendar-sync>Синхронизировать сейчас</button>':''}<button class="btn" type="button" data-calendar-refresh>Обновить статус</button>${conn&&!disconnected?'<button class="btn red" type="button" data-calendar-disconnect>Отключить</button>':''}</div>`;
}
async function openCalendarSettings(callback=null){
  const existing=$('#calendarSettingsDialog');if(existing){existing.focus();return}
  const dialog=document.createElement('dialog');dialog.id='calendarSettingsDialog';dialog.className='calendar-settings-dialog';dialog.setAttribute('aria-labelledby','calendarSettingsTitle');
  dialog.innerHTML='<header><h2 id="calendarSettingsTitle">Google Calendar</h2><button class="btn small" type="button" data-calendar-close aria-label="Закрыть настройки Google Calendar">Закрыть</button></header><div class="calendar-settings-content"><p>Крайние сроки задач и встречи появятся в отдельном календаре <b>Chief of Staff</b>.</p><p class="calendar-help">Даты берутся из приложения. Изменения в Google Calendar не меняют задачи и встречи здесь.</p><div data-calendar-message role="status" aria-live="polite"></div><div data-calendar-state aria-live="polite" aria-busy="true">Проверяю подключение…</div></div>';
  document.body.appendChild(dialog);const state=$('[data-calendar-state]',dialog),message=$('[data-calendar-message]',dialog);let busy=false,closed=false;
  const notice=(text,error=false)=>{message.textContent=text;message.className=text?(error?'error':'success'):''};
  const lock=value=>{busy=value;state.setAttribute('aria-busy',String(value));$$('button',state).forEach(b=>b.disabled=value)};
  const requestError=e=>e?.name==='TimeoutError'||e?.name==='AbortError'?'Сервер не ответил вовремя. Обновите статус перед повтором.':e?.message||'Не удалось получить состояние календаря.';
  const refresh=async()=>{
    lock(true);try{const status=await calendarRequest('status');if(closed)return;state.innerHTML=calendarStatusHTML(status);bind();if(callback?.kind==='connected'){const confirmed=status.authenticated&&status.connection?.status==='connected';notice(confirmed?'Подключение подтверждено. Первая синхронизация может занять около минуты.':'Подключение пока не подтверждено сервером. Обновите статус или подключитесь снова.',!confirmed);callback=null}return status}
    catch(e){if(closed)return;notice(requestError(e),true);if(!state.querySelector('[data-calendar-refresh]')){state.innerHTML='<button class="btn" type="button" data-calendar-refresh>Обновить статус</button>';bind()}throw e}
    finally{if(!closed)lock(false)}
  };
  const action=async kind=>{
    if(busy)return;if(kind==='disconnect'&&!confirm('Отключить синхронизацию с Google Calendar?'))return;
    lock(true);notice(kind==='sync'?'Выполняю синхронизацию…':'Отключаю календарь…');
    try{const result=await calendarRequest(kind,'POST');if(!result?.ok)throw Error('Сервер не подтвердил действие. Обновите статус.');if(closed)return;notice(kind==='sync'?'Синхронизация запрошена. Актуальное состояние показано ниже.':'Запрос на отключение выполнен. Проверяю состояние…');const status=await refresh();if(kind==='disconnect'&&status&&!status.authenticated)notice('Google Calendar отключён.')}
    catch(e){if(!closed)notice(requestError(e),true)}finally{if(!closed)lock(false)}
  };
  const bind=()=>{
    const re=$('[data-calendar-refresh]',state);if(re)re.onclick=()=>{if(!busy){notice('');refresh().catch(()=>{})}};
    const sy=$('[data-calendar-sync]',state);if(sy)sy.onclick=()=>action('sync');const de=$('[data-calendar-disconnect]',state);if(de)de.onclick=()=>action('disconnect');
    const form=$('[data-calendar-connect]',state);if(form)form.onsubmit=async e=>{e.preventDefault();if(busy)return;try{await flushNote();lock(true);form.submit()}catch(error){notice(requestError(error),true);lock(false)}};
  };
  $('[data-calendar-close]',dialog).onclick=()=>dialog.close();dialog.addEventListener('close',()=>{closed=true;dialog.remove()});dialog.showModal();
  if(callback?.kind==='error')notice(calendarReason(callback.reason),true);await refresh().catch(()=>{});
}
function initCalendarSettings(){
  $('#calendarSettings').onclick=()=>openCalendarSettings();
  const url=new URL(location.href),kind=url.searchParams.get('calendar');if(kind!=='connected'&&kind!=='error')return;
  const callback={kind,reason:url.searchParams.get('reason')};url.searchParams.delete('calendar');url.searchParams.delete('reason');history.replaceState(history.state,'',url.pathname+url.search+url.hash);openCalendarSettings(callback);
}

setInterval(()=>{syncMeetingStatuses().catch(()=>{});checkMeetingReminders().catch(()=>{})},60000);
