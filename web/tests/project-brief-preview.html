<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка обзора проекта — тестовые данные</title>
__BASE_STYLE__
<link rel="stylesheet" href="/dashboard.css"><link rel="stylesheet" href="/project-brief.css">
<style>body{margin:0;background:var(--bg);font-family:Arial,sans-serif}main{max-width:1240px;margin:auto}.fixture-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:white}.fixture-bar small{flex:1 1 220px;color:var(--muted)}#action{padding:0 30px}</style>
<script src="/project-brief.js" defer></script></head><body>
<header class="fixture-bar"><small>Проверка интерфейса. Все данные тестовые, изменения не сохраняются.</small><button class="btn" id="empty">Без записей</button><button class="btn" id="example">С записями</button></header>
<main><div id="brief"></div><p id="action" role="status"></p></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const id='11111111-1111-4111-8111-111111111111',now=new Date();let controller;
  const at=days=>new Date(now.getTime()+days*86400000).toISOString();
  const row=(key,fields)=>({id:key,project_id:id,...fields});
  const action=label=>document.querySelector('#action').textContent=label;
  function reset(example=true){
    controller?.dispose();action('');
    controller=CoSProjectBrief.mount(document.querySelector('#brief'),{
      automatic:true,project:{id,title:'Тестовый проект оборудования'},now,
      tasks:example?[
        row('drawing',{description:'Отправить заказчику чертёж стойки на согласование',status:'open',direction:'from_me',deadline_at:at(-1)}),
        row('materials',{description:'Сравнить стоимость материалов для основания',status:'open',direction:'internal',deadline_at:at(2)}),
        row('sample',{description:'Получить подтверждение срока изготовления образца',status:'open',direction:'to_me',participant_id:'supplier',deadline_at:at(1)}),
        row('paused',{description:'Уточнить упаковку перед серийным заказом',status:'paused',direction:'internal'}),
        row('done',{description:'Получить техническое задание',status:'completed'})
      ]:[],
      notes:example?[row('drawing-note',{title:'Требования к образцу',plain_text:'Проверить устойчивость стойки и высоту нижней полки. Размеры согласуем по чертежу.',created_at:at(-1)})]:[],
      meetings:example?[row('meeting',{title:'Согласовать конструкцию с заказчиком',starts_at:at(1),ends_at:new Date(now.getTime()+86400000+3600000).toISOString(),status:'scheduled',location:'Онлайн'})]:[],
      participants:[{id:'supplier',name:'Алексей · производство'}],
      requestNotes:async()=>({notes:example?[row('call',{title:'После звонка с производством',plain_text:'Материал есть на складе. Срок образца подтвердят завтра после проверки загрузки цеха.',source:'telegram',created_at:at(-0.1)})]:[],nextOffset:null}),
      request:async()=>({project_id:id,revision:1,document:{...CoSProjectBrief.emptyDocument(),...(example?{current_state:'Образец в работе. Сведения из прежнего обзора.'}:{})},history:[]}),
      onTask:key=>action('Открыта задача: '+key),onNote:key=>action('Открыта заметка с медиа: '+key),onQuickNote:note=>action('Открыта заметка Telegram: '+note.title),onMeeting:key=>action('Открыта встреча: '+key),onCreateTask:()=>action('Создание задачи'),onOpenTab:tab=>action('Открыта вкладка: '+tab)
    });
  }
  document.querySelector('#empty').onclick=()=>reset(false);document.querySelector('#example').onclick=()=>reset(true);reset();
});
</script></body></html>
