<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка состояния проекта — тестовые данные</title>
__BASE_STYLE__
<link rel="stylesheet" href="/dashboard.css"><link rel="stylesheet" href="/project-brief.css">
<style>body{margin:0;background:var(--bg);font-family:Arial, sans-serif}main{max-width:1180px;padding:24px;margin:auto}.fixture-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:white}.fixture-bar small{flex:1 1 220px;color:var(--muted)}</style>
<script src="/project-brief.js" defer></script></head><body>
<header class="fixture-bar"><small>Только проверка интерфейса. Тестовые данные хранятся в памяти страницы.</small><button class="btn" id="empty">Пустой паспорт</button><button class="btn" id="example">Пример</button></header>
<main><h1>Тестовый проект оборудования</h1><div id="brief"></div><p id="action" role="status"></p></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const id='11111111-1111-4111-8111-111111111111';let controller,record;const requests=new Map();
const blank=()=>({goal:'',current_state:'',next_step:'',checkpoint_label:'',checkpoint_on:null,entries:[]});
const project={id,title:'Тестовый проект оборудования',status:'active'};
const reset=(example=false)=>{if(controller&&!controller.canLeave())return;controller?.dispose();requests.clear();record={project_id:id,revision:example?1:0,updated_at:example?'2026-09-24T12:00:00Z':null,document:blank(),history:[]};if(example){record.document={goal:'Подготовить и согласовать образец стойки',current_state:'Чертёж получен. Размеры требуют уточнения.',next_step:'Запросить подтверждение размеров у заказчика',checkpoint_label:'Получить согласованный чертёж',checkpoint_on:null,entries:[{id:'22222222-2222-4222-8222-222222222222',kind:'waiting',text:'Подтверждение размеров стойки',person:'Заказчик',review_on:null,source:'Рабочее обсуждение — тестовый пример',status:'open'},{id:'33333333-3333-4333-8333-333333333333',kind:'question',text:'Какой материал использовать для основания?',person:'',review_on:null,source:'Тестовый пример',status:'open'},{id:'44444444-4444-4444-8444-444444444444',kind:'decision',text:'Сначала проверить один образец',person:'',review_on:null,source:'Тестовый пример',status:'open'}]}}
controller=CoSProjectBrief.mount(document.querySelector('#brief'),{project,tasks:[{id:'55555555-5555-4555-8555-555555555555',project_id:id,description:'Получить чертёж',status:'completed',direction:'to_me',created_at:'2026-09-23T09:00:00Z',updated_at:'2026-09-24T10:00:00Z'}],notes:[{id:'66666666-6666-4666-8666-666666666666',project_id:id,title:'Требования к образцу',plain_text:'Нужна проверка размеров.',created_at:'2026-09-23T11:00:00Z',updated_at:'2026-09-24T09:00:00Z'}],meetings:[],participants:[],request:async(options={})=>{if(!options.method)return structuredClone(record);const body=options.body;if(requests.has(body.request_id))return {...structuredClone(record),replayed:true};if(body.revision!==record.revision)throw Object.assign(Error('Конфликт версий'),{status:409,code:'project_brief_conflict'});record={...record,revision:record.revision+1,updated_at:new Date().toISOString(),document:structuredClone(body.document)};record.history.unshift({revision:record.revision,created_at:record.updated_at,changed_fields:Object.keys(body.document)});requests.set(body.request_id,true);return {...structuredClone(record),replayed:false}},onTask:()=>document.querySelector('#action').textContent='Открытие задачи — тестовый пример',onNote:()=>document.querySelector('#action').textContent='Открытие заметки — тестовый пример',onMeeting:()=>{},onCreateTask:()=>document.querySelector('#action').textContent='Создание задачи — тестовый пример',onLogin:()=>{},onError:message=>document.querySelector('#action').textContent=message});};
document.querySelector('#empty').onclick=()=>reset();document.querySelector('#example').onclick=()=>reset(true);reset();
});
</script></body></html>
