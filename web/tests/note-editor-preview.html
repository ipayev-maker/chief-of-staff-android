<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка заметки</title><style>body{font:18px/1.6 system-ui;color:#263448;background:#f4f6f9;margin:24px auto;max-width:760px;padding:0 20px}button{font:inherit;padding:9px 14px;background:white;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer}#editor{white-space:pre-wrap;min-height:300px;background:white;border:1px solid #ccd5e1;border-radius:12px;padding:24px;margin:18px 0;outline:none}figure{margin:16px 0;white-space:normal}img{max-width:100%;display:block;border-radius:8px}figure button{font-size:13px}#status{font-size:14px;color:#526277}</style><h1>Заметка с изображением</h1><p>Поставьте курсор между словами. Кнопка вставляет тестовое изображение через тот же обработчик, что и буфер обмена.</p><button id="paste">Вставить тестовую картинку</button> <button id="save">Сохранить</button> <button id="reopen">Открыть заново</button><div id="editor"></div><p id="status" aria-live="polite">Заметка открыта</p><script src="/note-editor.js"></script><script>
let stored={version:1,blocks:[{type:'text',text:'До картинки. После картинки.'}]},editor;const asset={id:'00000000-0000-4000-8000-000000000007',original_name:'Образец стойки',mime_type:'image/png',url:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220"><rect width="640" height="220" fill="#dce9ee"/><rect x="245" y="25" width="150" height="160" rx="12" fill="#48687b"/><path d="M225 190h190" stroke="#48687b" stroke-width="8"/><text x="24" y="195" font-size="19" fill="#48687b">Образец торговой стойки</text></svg>')};function mount(){editor?.dispose();editor=CoSNoteEditor.mount(document.getElementById('editor'),{document:stored,assets:[asset],onFiles:async()=>[asset],onChange:()=>{document.getElementById('status').textContent='Изменено'},onSave:save,onError:e=>{document.getElementById('status').textContent=e.message}})}function save(){stored=editor.getDocument();document.getElementById('status').textContent='Сохранено: '+stored.blocks.map(b=>b.type==='image'?'[картинка]':b.text).join(' → ')}document.getElementById('paste').onclick=()=>editor.addFiles([new File(['sample'],'image.png',{type:'image/png'})]);document.getElementById('save').onclick=save;document.getElementById('reopen').onclick=()=>{mount();document.getElementById('status').textContent='Заметка открыта заново'};mount();
</script></html>
