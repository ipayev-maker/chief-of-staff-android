<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка адаптивного интерфейса</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9edf2; color: #344456; font: 13px system-ui; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 18px; }
  header span { margin-right: 12px; }
  button { padding: 8px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 7px; cursor: pointer; }
  button[aria-pressed=true] { background: #dce7f3; }
  iframe { display: block; width: 390px; height: 820px; border: 1px solid #cbd5e1; margin: 0 18px 18px; background: white; }
</style>
<header><span>Ширина экрана</span><button data-width="390" aria-pressed="true">390 px</button><button data-width="768" aria-pressed="false">768 px</button><button data-width="1200" aria-pressed="false">1200 px</button></header>
<iframe title="Приложение" src="/"></iframe>
<script>
  document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
    document.querySelector('iframe').style.width = `${button.dataset.width}px`;
    document.querySelectorAll('[data-width]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
  }));
</script>
</html>
